name: Build and release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $projectVersion = ([xml](Get-Content BluetoothHeartrateModule/BluetoothHeartrateModule.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          # The project uses a four part version (2.0.21.0), tags use three (v2.0.21)
          if ($projectVersion -ne "$tagVersion.0" -and $projectVersion -ne $tagVersion) {
            throw "Tag $tagVersion does not match project version $projectVersion"
          }

      - name: Build
        run: dotnet build BluetoothHeartrateModule/BluetoothHeartrateModule.csproj -c Release

      - name: Collect release files
        shell: pwsh
        run: |
          $out = Get-ChildItem BluetoothHeartrateModule/bin -Recurse -Filter BluetoothHeartrateModule.dll |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } | Select-Object -First 1
          if (-not $out) { throw 'Built module DLL not found' }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item $out.FullName dist/
          Copy-Item (Join-Path $out.DirectoryName 'BluetoothHeartrateModule.pdb') dist/
          Copy-Item (Join-Path $out.DirectoryName 'Xceed.Wpf.Toolkit.dll') dist/
          Get-ChildItem dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BluetoothHeartrateModule
          path: dist/*

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist).FullName --title "${{ github.ref_name }}" --generate-notes
